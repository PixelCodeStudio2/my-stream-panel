<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Gaming Live Controller</title>
    <style>
        :root { --bg: #0a0b10; --panel: #141722; --neon: #00f0ff; --neon-dark: #008fa0; --text: #a0a5b5; --live: #00ff66; --offline: #ff3344; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: #ffffff; padding: 15px; display: flex; justify-content: center; margin: 0; }
        .container { width: 100%; max-width: 500px; background: var(--panel); padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.8); border: 1px solid #1f2438; margin-top: 15px; }
        
        /* Top Header Grid */
        .header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 12px; border: 1px solid #1a1f30; margin-bottom: 20px; }
        .status-box { display: flex; align-items: center; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; display: inline-block; }
        .dot-offline { background-color: var(--offline); box-shadow: 0 0 10px var(--offline); }
        .dot-live { background-color: var(--live); box-shadow: 0 0 12px var(--live); animation: blink 1.2s infinite; }
        .storage-box { font-size: 11px; text-align: right; color: var(--neon); font-family: monospace; line-height: 1.4; }

        h2 { text-align: center; color: var(--neon); margin: 0 0 20px 0; font-size: 22px; text-shadow: 0 0 10px rgba(0,240,255,0.3); letter-spacing: 1px; text-transform: uppercase; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text); }
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #232a3d; background: #07090e; color: #fff; box-sizing: border-box; font-size: 14px; transition: all 0.3s; }
        input[type="text"]:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 8px rgba(0,240,255,0.4); }

        /* Video Preview Screen */
        .preview-wrapper { width: 100%; height: 150px; background: #000; border-radius: 8px; margin-bottom: 15px; border: 1px dashed var(--neon-dark); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .preview-placeholder { color: var(--text); font-size: 12px; text-align: center; padding: 10px; }

        /* Buttons & Actions */
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; transition: all 0.3s; letter-spacing: 0.5px; margin-top: 5px; }
        .btn-start { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; box-shadow: 0 4px 15px rgba(0,114,255,0.3); }
        .btn-start:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,114,255,0.5); }
        .btn-stop { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; margin-top: 12px; display: none; }

        /* Premium Loading percentage bar */
        #progressContainer { display: none; margin-top: 15px; background: #07090e; border-radius: 8px; overflow: hidden; height: 28px; border: 1px solid #1a2030; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon-dark), var(--neon)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; color: #000; transition: width 0.1s; }
        #loadingStatus { text-align: center; color: var(--neon); font-size: 12px; margin-top: 6px; display: none; font-weight: 500; }

        .console-title { font-size: 13px; font-weight: bold; color: var(--neon); margin-top: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
        .console-box { background: #040508; color: #00ff66; padding: 12px; height: 90px; overflow-y: auto; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 11px; margin-top: 6px; border: 1px solid #161b26; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-grid">
            <div class="status-box" id="statusBox">
                <span class="dot dot-offline" id="statusDot"></span>
                <span id="statusText" style="color:var(--offline)">OFFLINE</span>
            </div>
            <div class="storage-box">
                Max Time: <span style="color:#fff;">24 Hours</span><br>
                Cloud Space: <span id="fileSizeLabel" style="color:var(--neon);">0.0 MB</span>
            </div>
        </div>

        <h2>🎮 Stream Cloud Hub</h2>
        
        <div class="preview-wrapper" id="previewWrapper">
            <span class="preview-placeholder" id="placeholderText">No video selected. Upload a file to see preview here.</span>
            <video id="videoPlayback" controls muted></video>
        </div>

        <form id="controlPanel">
            <div class="form-group">
                <label>YouTube Stream Key (Stored Safely):</label>
                <input type="text" id="streamKey" placeholder="Yahan apni stream key paste karein" required>
            </div>
            <div class="form-group">
                <label>Select Free Fire/Gaming Video:</label>
                <input type="file" id="videoFile" accept="video/*" required>
            </div>
            <div class="form-group">
                <label>Schedule Auto-Stop Timer:</label>
                <select id="scheduleTimer">
                    <option value="24">Run Full 24 Hours Loop</option>
                    <option value="12">Run 12 Hours Only</option>
                    <option value="6">Run 6 Hours Only</option>
                    <option value="1">Run 1 Hour Only</option>
                </select>
            </div>

            <div id="progressContainer"><div id="progressBar">0%</div></div>
            <div id="loadingStatus">Uploading to permanent database...</div>

            <button type="submit" class="btn-start" id="startBtn">🚀 Launch 24/7 Live Loop</button>
        </form>
        <button onclick="stopStreamingProcess()" class="btn-stop" id="stopBtn">🛑 Kill Live Stream</button>

        <div class="console-title">Engine Terminal:</div>
        <div class="console-box" id="terminalLog">Dashboard Connected. Cloud Server Ready...</div>
    </div>

    <script>
        const videoInput = document.getElementById('videoFile');
        const videoPlayback = document.getElementById('videoPlayback');
        const placeholderText = document.getElementById('placeholderText');

        // Real-Time Local Video Preview Handler
        videoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('fileSizeLabel').innerText = sizeMB + ' MB';
                placeholderText.style.display = 'none';
                videoPlayback.style.display = 'block';
                videoPlayback.src = URL.createObjectURL(file);
            }
        });

        document.getElementById('controlPanel').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const loadingStatus = document.getElementById('loadingStatus');
            const terminal = document.getElementById('terminalLog');
            
            progressContainer.style.display = 'block';
            loadingStatus.style.display = 'block';
            terminal.innerHTML += '<br>[SYSTEM] Uploading file packets...';

            // Percentage upload progress logic simulation
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingStatus.innerText = 'File Linked! Sending trigger command to GitHub server engine...';
                    setTimeout(() => {
                        triggerGitHubStream();
                    }, 1000);
                }
                progressBar.style.width = progress + '%';
                progressBar.innerText = progress + '%';
            }, 200);
        });

        function triggerGitHubStream() {
            // Trigger UI logic updating status to active live
            document.getElementById('statusDot').className = 'dot dot-live';
            const statusText = document.getElementById('statusText');
            statusText.innerText = 'LIVE ACTIVE';
            statusText.style.color = 'var(--live)';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('loadingStatus').innerText = 'Stream running 24/7 on background cloud!';
            document.getElementById('terminalLog').innerHTML += '<br>[CLOUD] FFmpeg command injected successfully. Stream Key locked.';
        }

        function stopStreamingProcess() {
            document.getElementById('statusDot').className = 'dot dot-offline';
            const statusText = document.getElementById('statusText');
            statusText.innerText = 'OFFLINE';
            statusText.style.color = 'var(--offline)';
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
