<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ CYBER PANEL PRO: 24/7 STREAM ENGINE ⚡</title>
    <style>
        :root { 
            --bg-darker: #030408;
            --bg-main: #070913; 
            --panel-glow: #0d122c; 
            --neon-blue: #00f0ff; 
            --neon-red: #ff0055; 
            --neon-green: #00ff66;
            --text-bright: #ffffff; 
            --text-muted: #61718a; 
            --card-border: #18224b;
        }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-darker); 
            color: var(--text-bright); 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #11173b 0%, var(--bg-darker) 80%);
        }
        .mainframe { 
            width: 100%; 
            max-width: 530px; 
            background: var(--bg-main); 
            padding: 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 40px rgba(0,240,255,0.03); 
            border: 1px solid var(--card-border); 
            margin-top: 10px; 
            box-sizing: border-box;
        }
        
        .system-monitor { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: rgba(2, 3, 10, 0.8); 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid #141d3d; 
            margin-bottom: 25px; 
        }
        .status-badge { 
            display: flex; 
            align-items: center; 
            font-weight: 900; 
            font-size: 12px; 
            letter-spacing: 2px;
            padding: 8px 14px;
            background: rgba(255, 0, 85, 0.07);
            border-radius: 30px;
            border: 1px solid rgba(255, 0, 85, 0.2);
            width: fit-content;
            transition: all 0.4s;
        }
        .dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            margin-right: 10px; 
            display: inline-block; 
        }
        .dot-offline { background-color: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }
        .dot-live { background-color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); animation: blink 1s infinite; }
        .storage-monitor { 
            font-size: 11px; 
            text-align: right; 
            color: var(--neon-blue); 
            font-family: monospace; 
            line-height: 1.5;
            font-weight: bold;
        }

        h2 { 
            text-align: center; 
            color: var(--neon-blue); 
            margin: 0 0 25px 0; 
            font-size: 22px; 
            text-shadow: 0 0 15px rgba(0,240,255,0.4); 
            letter-spacing: 3px; 
            font-weight: 900;
            text-transform: uppercase; 
        }

        .cyber-card {
            background: rgba(13, 18, 44, 0.4);
            border: 1px solid #141d40;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,240,255,0.02);
            transition: all 0.3s;
        }
        .cyber-card:hover {
            border-color: #1d2d66;
            box-shadow: inset 0 0 20px rgba(0,240,255,0.04);
        }
        .card-header-tag {
            font-size: 11px;
            font-weight: 900;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            border-left: 3px solid var(--neon-blue);
            padding-left: 8px;
        }

        .input-wrapper { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], input[type="password"], select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #192347; 
            background: #03050c; 
            color: #fff; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-family: monospace;
            transition: all 0.3s; 
        }
        input:focus, select:focus { 
            border-color: var(--neon-blue); 
            outline: none; 
            box-shadow: 0 0 12px rgba(0,240,255,0.3); 
        }

        .viewport-screen { 
            width: 100%; 
            height: 170px; 
            background: #010205; 
            border-radius: 12px; 
            border: 1px dashed #1d2954; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
        }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .viewport-placeholder { color: var(--text-muted); font-size: 12px; text-align: center; font-weight: 600; letter-spacing: 0.5px; font-family: monospace; }

        .cyber-upload-trigger {
            display: block;
            text-align: center;
            background: #03050c;
            border: 1px dashed var(--neon-blue);
            padding: 16px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--neon-blue);
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .cyber-upload-trigger:hover { background: rgba(0, 240, 255, 0.07); text-shadow: 0 0 8px var(--neon-blue); }

        button { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 900; 
            transition: all 0.3s; 
            letter-spacing: 1.5px; 
            text-transform: uppercase;
        }
        .btn-launch { 
            background: linear-gradient(135deg, #00f0ff, #0040e6); 
            color: white; 
            box-shadow: 0 6px 25px rgba(0,64,230,0.4); 
        }
        .btn-launch:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 30px rgba(0,64,230,0.6); 
        }
        .btn-abort { 
            background: linear-gradient(135deg, var(--neon-red), #aa0033); 
            color: white; 
            margin-top: 15px; 
            display: none; 
            box-shadow: 0 6px 20px rgba(255,0,85,0.3);
        }

        #progressContainer { display: none; margin-top: 18px; background: #010205; border-radius: 8px; overflow: hidden; height: 28px; border: 1px solid #1a234a; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, #0040e6, var(--neon-blue)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #fff; transition: width 0.1s; }
        #loadingStatus { text-align: center; color: var(--neon-blue); font-size: 11px; margin-top: 8px; display: none; font-weight: 700; font-family: monospace; letter-spacing: 0.5px; }

        .terminal-header { font-size: 11px; font-weight: 900; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; margin-top: 25px; }
        .terminal-console { background: #010205; color: var(--neon-green); padding: 15px; height: 90px; overflow-y: auto; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 11px; margin-top: 8px; border: 1px solid #111830; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="mainframe">
        <div class="system-monitor">
            <div class="status-badge" id="statusBox">
                <span class="dot dot-offline" id="statusDot"></span>
                <span id="statusText" style="color:var(--neon-red)">OFFLINE</span>
            </div>
            <div class="storage-monitor">
                AUTO-CLEAN: <span style="color:var(--neon-green);">ACTIVE (0% USED)</span><br>
                PAYLOAD SIZE: <span id="fileSizeLabel" style="color:var(--neon-blue);">0.0 MB</span>
            </div>
        </div>

        <h2>⚡ STREAM ENGINE MAINBOARD ⚡</h2>
        
        <div class="cyber-card">
            <div class="card-header-tag">🔐 ENCRYPTED CLOUD GATEWAY</div>
            <div class="input-wrapper">
                <label>GitHub Personal Access Token:</label>
                <input type="password" id="githubToken" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX" required>
            </div>
            <div class="input-wrapper">
                <label>YouTube RTMP Stream Key:</label>
                <input type="password" id="streamKey" placeholder="Pasted Key (Hidden Protection)" required>
            </div>
        </div>

        <div class="cyber-card">
            <div class="card-header-tag">🎮 TARGET MEDIA DISPATCHER</div>
            <div class="input-wrapper">
                <label for="videoFile" class="cyber-upload-trigger">📂 LOAD GAMING FOOTAGE / FILE</label>
                <input type="file" id="videoFile" accept="video/*" style="display:none;" required>
            </div>
            <div class="viewport-screen" id="viewportScreen">
                <span class="viewport-placeholder" id="placeholderText">[ MAINFRAME STANDBY: LOAD MP4 FILE ]</span>
                <video id="videoPlayback" controls muted></video>
            </div>
        </div>

        <div class="cyber-card">
            <div class="card-header-tag">⏱️ CORE SCHEDULER WINDOW</div>
