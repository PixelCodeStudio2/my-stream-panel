name: 24-7 Infinite Live Stream Engine

on:
  repository_dispatch:
    types: [start_stream] # Yeh event Hugging Face ke button se match karta hai

jobs:
  live_stream:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install FFmpeg (Powerful Streaming Tool)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Run Infinite Loop Live Stream
      run: |
        echo "Starting Live Stream Engine..."
        
        # Hugging Face se bheja hua data uthayein
        VIDEO_URL="${{ github.event.client_payload.video_url }}"
        STREAM_KEY="${{ github.event.client_payload.stream_key }}"
        
        # FFmpeg command jo video ko crash nahi hone dega aur infinite chalayega
        ffmpeg -re -stream_loop -1 -i "$VIDEO_URL" \
        -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
        -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 \
        -f flv "rtmp://://youtube.com"
